name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# アクションは commit SHA で固定する（shipstack が計画に書かせる決まりと同じ）。版はコメントに残し、Dependabot が上げる。
jobs:
  test:
    # README の「python3（3.9 以上）」の下限（macOS の /usr/bin/python3 の版）と、最新の版で流す。
    # Python 3.9 の配布物は Ubuntu 24.04 までにしか無い（actions/python-versions）ので、runner を固定する。
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: 共通のスクリプトの試験
        run: python3 -I -B -m unittest discover -s plugins/shipstack/tests -v
      - name: shipstack の点検のスクリプトの試験
        run: python3 -I -B -m unittest discover -s .claude/skills/checking-shipstack/tests -v

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: マーケットプレイスとプラグインの形
        run: |
          npx -y @anthropic-ai/claude-code@2.1.322 plugin validate .
          npx -y @anthropic-ai/claude-code@2.1.322 plugin validate plugins/shipstack
          npx -y @anthropic-ai/claude-code@2.1.322 plugin validate plugins/explainer-video

  explainer-video-template:
    # explainer-video の雛形のプロジェクトが、入れたままの状態で型・lint・未使用の検査を通るか。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/explainer-video/skills/making-video/assets/template
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: 依存関係
        run: npm install --loglevel=error --no-fund --no-audit
      - name: Biome・型・knip
        run: npm run lint
      - name: 絵コンテとチャプターの生成（音声なしで尺を計算できること）
        run: |
          npm run storyboard -- sample
          npm run chapters -- sample
